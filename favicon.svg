<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Squircle Background -->
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sunlit Port Facet (Left) -->
    <linearGradient id="portFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shaded Starboard Facet (Right) -->
    <linearGradient id="starboardFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Neon Glow for Math Plus Operator -->
    <filter id="mathGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Dark Base Squircle Tile -->
  <rect width="64" height="64" rx="14" fill="url(#mathBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- 2. Mathematical Coordinate Matrix (Subtle background grid) -->
  <g opacity="0.25">
    <line x1="32" y1="6" x2="32" y2="58" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" />
    <line x1="8" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" />
    <!-- Outer Delta Frame Hint -->
    <polygon points="32,10 53,46 11,46" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.3" />
  </g>

  <!-- 3. Equals (=) Calculation Streams (Engine Exhaust) -->
  <g stroke-linecap="round">
    <line x1="26" y1="51" x2="38" y2="51" stroke="#38bdf8" stroke-width="2.2" opacity="0.9" />
    <line x1="26" y1="56" x2="38" y2="56" stroke="#0284c7" stroke-width="2.2" opacity="0.7" />
  </g>

  <!-- 4. Ascending Nose-Up Delta Jet -->
  <g id="aircraft-delta">
    <!-- Port Wing & Half-Delta (Left) -->
    <path d="M 32 8 
         L 30 20 
         L 11 38 
         L 11 43 
         L 28 38 
         L 28 47 
         L 21 51 
         L 31.5 49 
         L 32 49 
         Z" fill="url(#portFacet)" />

    <!-- Starboard Wing & Half-Delta (Right) -->
    <path d="M 32 8 
         L 34 20 
         L 53 38 
         L 53 43 
         L 36 38 
         L 36 47 
         L 43 51 
         L 32.5 49 
         L 32 49 
         Z" fill="url(#starboardFacet)" />

    <!-- Center Calculation Line / Dorsal Axis -->
    <line x1="32" y1="8" x2="32" y2="49" stroke="#ffffff" stroke-width="0.75" opacity="0.6" />

    <!-- Cockpit Canopy (Needle Accent) -->
    <path d="M 32 14 L 30.8 21 L 32 23 L 33.2 21 Z" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- 5. Mathematical Plus (+) Operator (Core Intersection) -->
  <g filter="url(#mathGlow)">
    <!-- Vertical Bar -->
    <rect x="30.75" y="27" width="2.5" height="11" rx="1.25" fill="#ffffff" />
    <!-- Horizontal Bar -->
    <rect x="26.5" y="31.25" width="11" height="2.5" rx="1.25" fill="#ffffff" />
    <!-- Center Point Flare -->
    <circle cx="32" cy="32.5" r="1.5" fill="#7dd3fc" />
  </g>
</svg>
